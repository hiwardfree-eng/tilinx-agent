name: build-tilinx-windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Node + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        run: npm install -g pnpm@9

      - name: Install deps (UI)
        run: pnpm install --frozen-lockfile=false

      - name: Build UI
        run: pnpm build

      - name: Setup bun
        shell: bash
        run: npm install -g bun

      - name: Build host sidecar (bun)
        shell: bash
        run: bash scripts/build-host-sidecar.sh x86_64-pc-windows-msvc

      - name: Build engine (tilinx-app)
        run: cargo build --release -p tilinx-app

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: tilinx-app-windows
          path: target/release/tilinx-app.exe