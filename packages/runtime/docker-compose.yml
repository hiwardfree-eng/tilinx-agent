# TilinX pi-runtime — standalone runtime via Docker Compose.
#
#   cp .env.example .env        # then set TILINX_RUNTIME_TOKEN
#   docker compose up -d --build
#   docker compose logs -f
#
# The build context is the repo root so the image can pull in the sibling
# @tilinx/runtime-client package (see Dockerfile). The image's HEALTHCHECK and
# graceful-shutdown handling are inherited as-is.

services:
  engine:
    build:
      context: ../..
      dockerfile: packages/runtime/Dockerfile
    image: tilinx/pi-runtime:local
    restart: unless-stopped
    ports:
      # host:container — the container always listens on 4317 internally.
      - "${TILINX_HOST_PORT:-4317}:4317"
    environment:
      # Bind on all interfaces inside the container (default 127.0.0.1 would be
      # unreachable from outside it).
      TILINX_HOST: "0.0.0.0"
      TILINX_PORT: "4317"
      TILINX_DATA_DIR: "/data"
      TILINX_WORKSPACE_DIR: "/workspace"
      # Required. Compose errors out if it's unset, so the engine is never
      # exposed without auth.
      TILINX_RUNTIME_TOKEN: "${TILINX_RUNTIME_TOKEN:?set TILINX_RUNTIME_TOKEN in .env (try: openssl rand -hex 32)}"
      TILINX_CORS_ORIGIN: "${TILINX_CORS_ORIGIN:-*}"
    volumes:
      # auth.json + conversation transcripts. Survives container restarts.
      - tilinx-data:/data
      # The directory the agent may read and edit. Swap the named volume for a
      # bind mount to expose a real project, e.g.  - /srv/my-project:/workspace
      - tilinx-workspace:/workspace

volumes:
  tilinx-data:
  tilinx-workspace:
