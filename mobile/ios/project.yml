# XcodeGen project spec for the TilinX iOS app.
# Regenerate the .xcodeproj with:  cd mobile/ios && xcodegen generate
# The generated TilinX.xcodeproj is NOT committed (see .gitignore) — it is a
# pure function of this file, so the spec is the single source of truth.

name: TilinX

options:
  bundleIdPrefix: com.gettilinx
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# Project-wide build settings. Signing is left Xcode-managed (Automatic) with an
# EMPTY development team: set your team once on the TilinX target in Xcode
# (Signing & Capabilities), or export DEVELOPMENT_TEAM in the environment.
settings:
  base:
    SWIFT_VERSION: "5.0"        # Swift 5.9 toolchain, language mode 5
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""        # <-- USER: set your 10-char Apple Team ID here (or in Xcode)
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO   # run-script phases shell out to pnpm/node
    SWIFT_STRICT_CONCURRENCY: targeted
    # SE-0411: default-argument expressions adopt the enclosing declaration's
    # isolation, so a @MainActor member's default of `SdkClient.shared` (itself
    # @MainActor) is evaluated on the main actor instead of a nonisolated
    # context. This is Swift-6 semantics, opted into under language mode 5.
    OTHER_SWIFT_FLAGS: "$(inherited) -enable-upcoming-feature IsolatedDefaultValues"

targets:
  TilinX:
    type: application
    platform: iOS
    sources:
      # Whole app source tree; the generated Generated/ group is added
      # explicitly below (it does not exist until the build phases run).
      - path: TilinX
        excludes:
          - "Generated/**"
          - "Info.plist"
          - "TilinX.entitlements"
      # Apple privacy manifest — bundled as a resource (App Store requirement).
      - path: TilinX/PrivacyInfo.xcprivacy
        buildPhase: resources
      # Design tokens synced from packages/design-tokens by the pre-build phase.
      - path: TilinX/Generated/TilinXTokens.swift
        optional: true
      # SDK bridge bundle built by the pre-build phase, bundled as a resource.
      - path: TilinX/Generated/tilinx-sdk.bridge.js
        optional: true
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gettilinx.TilinX
        PRODUCT_NAME: TilinX
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: TilinX/TilinX.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
    info:
      path: TilinX/Info.plist
      properties:
        CFBundleDisplayName: TilinX
        # Shipped UI languages (Localizable.xcstrings mirrors desktop en/es/pt).
        # Explicit so the per-app language picker appears in iOS Settings.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - es
          - pt
        # Version comes from the build settings above; without these XcodeGen
        # writes literal 1.0/1 and the target's MARKETING_VERSION is ignored.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # HTTPS-only standard crypto: exempt, so TestFlight uploads skip the
        # per-build export-compliance question.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # OAuth callback deep link: the Microsoft flow redirects to
        # tilinx://auth-callback (Google uses its reversed-client-ID scheme,
        # which ASWebAuthenticationSession intercepts without registration;
        # Apple sign-in is fully native; the email code never leaves the app).
        CFBundleURLTypes:
          - CFBundleURLName: com.gettilinx.TilinX
            CFBundleURLSchemes:
              - tilinx
        # App Transport Security: keep the secure default (no arbitrary loads).
        # The gateway and GCIP endpoints are HTTPS, so no exceptions are required.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    preBuildScripts:
      # (1) Build the @tilinx/sdk bridge bundle and stage it as a resource.
      #     Skipped incrementally when the dist bundle is unchanged.
      - name: Build SDK bundle
        script: |
          "${SRCROOT}/scripts/build-sdk-bundle.sh"
        basedOnDependencyAnalysis: true
        inputFiles:
          - $(SRCROOT)/../../packages/sdk/dist/tilinx-sdk.bridge.js
        outputFiles:
          - $(SRCROOT)/TilinX/Generated/tilinx-sdk.bridge.js
      # (2) Sync the generated SwiftUI design tokens into Generated/ so the
      #     DesignSystem sources can compile against them.
      - name: Sync design tokens
        script: |
          "${SRCROOT}/scripts/sync-design-tokens.sh"
        basedOnDependencyAnalysis: true
        inputFiles:
          - $(SRCROOT)/../../packages/design-tokens/dist/swift/TilinXTokens.swift
        outputFiles:
          - $(SRCROOT)/TilinX/Generated/TilinXTokens.swift

  TilinXTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TilinXTests
    dependencies:
      - target: TilinX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gettilinx.TilinXTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TilinX.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TilinX"
        BUNDLE_LOADER: "$(TEST_HOST)"
        # Unit-test bundle carries no hand-authored Info.plist; let Xcode
        # synthesize one (the modern default) so the bundle can be code-signed.
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TilinX:
    build:
      targets:
        TilinX: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - TilinXTests
    profile:
      config: Release
    archive:
      config: Release
