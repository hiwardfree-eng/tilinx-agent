<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TilinX Banner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "SF Pro Display", "SF Pro Text", BlinkMacSystemFont, sans-serif;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .banner {
    width: 1500px;
    height: 500px;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
  }
  .blackhole {
    width: 220px;
    height: auto;
    margin-bottom: 28px;
  }
  .name {
    font-size: 52px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: #0d0d0d;
    line-height: 1;
    margin-bottom: 12px;
  }
  .tagline {
    font-size: 26px;
    font-weight: 400;
    color: #9b9b9b;
    letter-spacing: -0.01em;
    line-height: 1;
  }
</style>
</head>
<body>
<div class="banner">
  <svg class="blackhole" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="diskOG" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
        <stop offset="38%" stop-color="#ffb703" stop-opacity="0.9"/>
        <stop offset="58%" stop-color="#fb8500" stop-opacity="0.75"/>
        <stop offset="75%" stop-color="#b5179e" stop-opacity="0.45"/>
        <stop offset="100%" stop-color="#023e8a" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="glow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
        <stop offset="12%" stop-color="#ffe066" stop-opacity="0.9"/>
        <stop offset="28%" stop-color="#ff9e00" stop-opacity="0.4"/>
        <stop offset="52%" stop-color="#3b5bdb" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="#3b5bdb" stop-opacity="0"/>
      </radialGradient>
      <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="5"/>
      </filter>
    </defs>

    <!-- campo de estrellas -->
    <g fill="#0d0d0d">
      <circle cx="38" cy="62" r="1.6"/><circle cx="92" cy="24" r="1.1"/><circle cx="150" cy="90" r="1.4"/>
      <circle cx="330" cy="52" r="1.5"/><circle cx="368" cy="138" r="1.2"/><circle cx="50" cy="330" r="1.3"/>
      <circle cx="210" cy="24" r="1.0"/><circle cx="286" cy="356" r="1.6"/><circle cx="336" cy="308" r="1.1"/>
      <circle cx="64" cy="206" r="1.2"/><circle cx="352" cy="250" r="1.4"/><circle cx="128" cy="368" r="1.0"/>
    </g>

    <!-- halo exterior (lente gravitacional) -->
    <circle cx="200" cy="200" r="112" fill="url(#diskOG)" filter="url(#soft)"/>

    <!-- disco de acreción: anillos elípticos alabeados -->
    <g transform="rotate(-18 200 200)" fill="none" stroke-linecap="round">
      <ellipse cx="200" cy="200" rx="96" ry="42" stroke="#ffb703" stroke-width="7" opacity="0.85"/>
      <ellipse cx="200" cy="200" rx="120" ry="58" stroke="#fb8500" stroke-width="5" opacity="0.6"/>
      <ellipse cx="200" cy="200" rx="70" ry="26" stroke="#ffe066" stroke-width="9" opacity="0.95"/>
      <ellipse cx="200" cy="200" rx="150" ry="80" stroke="#b5179e" stroke-width="3" opacity="0.4"/>
    </g>

    <!-- anillo de fotones justo en el borde del horizonte -->
    <circle cx="200" cy="200" r="46" fill="none" stroke="#fff3b0" stroke-width="2.4" opacity="0.95"/>
    <circle cx="200" cy="200" r="43" fill="none" stroke="#ffe066" stroke-width="1" opacity="0.8" stroke-dasharray="4 3"/>

    <!-- brillo central -->
    <circle cx="200" cy="200" r="46" fill="url(#glow)" filter="url(#soft)"/>

    <!-- horizonte de sucesos -->
    <circle cx="200" cy="200" r="32" fill="#050505"/>
    <circle cx="200" cy="200" r="32" fill="none" stroke="#3b5bdb" stroke-width="0.8" opacity="0.5"/>
  </svg>
  <div class="name">TilinX</div>
  <div class="tagline">Ship the impossible</div>
</div>
</body>
</html>
